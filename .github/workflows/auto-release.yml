name: auto-release

# Single-crate auto-release shim — every push to main bumps the version and
# releases to the registry. Logic lives in pleme-io/substrate; see the org
# ★★ AUTO-RELEASE + ★ AUTOBUMP doctrine (never hand-type a version).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump-type:
        description: "patch | minor | major"
        required: false
        default: patch

jobs:
  release:
    uses: pleme-io/substrate/.github/workflows/cargo-auto-release.yml@main
    with:
      bump-type: ${{ inputs.bump-type || 'patch' }}
    secrets: inherit
